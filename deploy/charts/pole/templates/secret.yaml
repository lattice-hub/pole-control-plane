{{- if .Values.secrets.create }}
{{- $authSalt := required "secrets.authSalt is required when secrets.create=true" .Values.secrets.authSalt }}
{{- if not (has (len $authSalt) (list 16 24 32)) }}
{{- fail "secrets.authSalt must contain exactly 16, 24, or 32 bytes" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pole.secretName" . }}
  labels:
    {{- include "pole.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword is required when secrets.create=true" .Values.secrets.mysqlRootPassword | quote }}
  MYSQL_USER: {{ required "secrets.mysqlUser is required when secrets.create=true" .Values.secrets.mysqlUser | quote }}
  MYSQL_PWD: {{ required "secrets.mysqlPassword is required when secrets.create=true" .Values.secrets.mysqlPassword | quote }}
  CONSOLE_JWT_SECRET: {{ required "secrets.consoleJwtSecret is required when secrets.create=true" .Values.secrets.consoleJwtSecret | quote }}
  AUTH_SALT: {{ $authSalt | quote }}
  SYSTEM_SECRET_MASTER_KEY: {{ required "secrets.systemSecretMasterKey is required when secrets.create=true" .Values.secrets.systemSecretMasterKey | quote }}
  SELF_MANAGER_PROBE_KEY: {{ required "secrets.selfManagerProbeKey is required when secrets.create=true" .Values.secrets.selfManagerProbeKey | quote }}
  OSS_ACCESS_KEY_ID: {{ .Values.secrets.ossAccessKeyId | quote }}
  OSS_ACCESS_KEY_SECRET: {{ .Values.secrets.ossAccessKeySecret | quote }}
{{- end }}
